<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Degradado del cielo atardecer/noche -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1c5c" />
      <stop offset="45%" stop-color="#462c75" />
      <stop offset="75%" stop-color="#a45c75" />
      <stop offset="100%" stop-color="#ddaa9c" />
    </linearGradient>
    
    <!-- Máscara para crear la luna creciente -->
    <mask id="moonMask">
      <rect width="256" height="256" fill="black" />
      <circle cx="165" cy="80" r="55" fill="white" />
      <circle cx="140" cy="60" r="53" fill="black" />
    </mask>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="256" height="256" rx="45" fill="url(#skyGrad)" />

  <!-- Luna -->
  <circle cx="165" cy="80" r="55" fill="#ffffff" opacity="0.15" /> <!-- Brillo exterior -->
  <rect width="256" height="256" fill="#ffffff" mask="url(#moonMask)" />

  <!-- Estrellas -->
  <g fill="#ffffff">
    <!-- Estrella grande izquierda -->
    <circle cx="35" cy="55" r="4.5" />
    <circle cx="35" cy="55" r="9" opacity="0.2" />
    <!-- Constelación -->
    <circle cx="65" cy="28" r="2.5" opacity="0.9" />
    <circle cx="85" cy="45" r="3.5" />
    <circle cx="85" cy="45" r="6" opacity="0.2" />
    <circle cx="70" cy="98" r="3.5" />
    <circle cx="78" cy="85" r="2.5" opacity="0.8" />
    <circle cx="88" cy="92" r="2.5" opacity="0.8" />
    <circle cx="110" cy="120" r="4" />
    <circle cx="110" cy="120" r="7" opacity="0.2" />
    <circle cx="75" cy="142" r="3" opacity="0.9" />
  </g>

  <!-- Colinas del fondo -->
  <path d="M 80,200 Q 180,185 256,175 L 256,256 L 80,256 Z" fill="#2d1c3a" opacity="0.8" />

  <!-- Silueta del bosque / Montaña principal -->
  <path d="M 0,130 
           L 4,120 L 8,132 L 12,118 L 16,130 
           L 20,122 L 25,135 L 30,125 L 35,140 
           L 40,132 L 45,145 L 50,138 L 56,152 
           L 62,145 L 68,160 L 75,152 L 82,170 
           L 90,165 L 98,180 L 105,175 L 115,190
           Q 160,225 256,210 
           L 256,256 L 0,256 Z" fill="#09090b" />
  
  <!-- Curva del suelo -->
  <path d="M 0,225 Q 128,260 256,215 L 256,256 L 0,256 Z" fill="#000000" />
</svg>
